*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.45}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:var(--green)}
button,select,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{width:100%;margin:0;padding:22px clamp(14px,2.2vw,36px) 60px}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:16px}
.aclogo{height:52px;width:auto;display:block;background:var(--logo-bg);padding:var(--logo-pad);border-radius:9px;box-sizing:content-box;filter:var(--logo-filter,none)}
.demo{color:var(--on-green);background:var(--amber);font-weight:800;border-radius:5px;padding:1px 7px;font-size:11px}
.logo-dial{width:40px;height:40px;border-radius:50%;border:3px solid var(--green);position:relative;background:var(--input);box-shadow:0 0 18px rgba(57,255,20,.25)}
.logo-dial::before,.logo-dial::after{content:"";position:absolute;left:50%;bottom:50%;width:3px;background:var(--green);transform-origin:bottom center;border-radius:2px}
.logo-dial::before{height:12px;transform:translateX(-50%) rotate(-40deg)}
.logo-dial::after{height:15px;transform:translateX(-50%) rotate(65deg)}
.logo h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.04em}
.logo h1 span{color:var(--green)}
.top{display:flex;align-items:center;gap:20px 28px;flex-wrap:wrap}
.tiles{display:flex;gap:14px;flex-wrap:wrap}

input.cell{width:100%;min-width:130px;background:var(--input);border:1px dashed var(--line2);color:var(--text);font:inherit;font-size:12.5px;padding:6px 8px;border-radius:6px}
input.cell.num{text-align:right;min-width:110px}
input.cell:hover{border-color:var(--green-dim)}
input.cell:focus{outline:none;border:1px solid var(--green);background:var(--panel2);box-shadow:0 0 0 1px var(--green)}
input.cell::placeholder{color:var(--faint)}
input.cell.saving{border-style:solid;border-color:var(--amber)}
input.cell.saved{border-style:solid;border-color:var(--green)}
input.cell.bad{border-style:solid;border-color:var(--red)}
.fillnote{font-size:12px;color:var(--faint);margin-top:8px}
.fillnote b{color:var(--amber);font-weight:500}
.combo{position:relative;display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;min-width:220px}
.combo:focus-within{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.combo-lab{color:var(--faint);font-size:12px;padding-left:9px;white-space:nowrap}
.combo input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:12.5px;padding:6px 9px}
.combo input:focus{outline:none}
.combo-list{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);max-height:280px;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;z-index:30;padding:4px}
.combo-list div{padding:6px 9px;border-radius:5px;font-size:12.5px;cursor:pointer}
.combo-list div.on{background:var(--green);color:var(--on-green)}
.combo-list div.cur:not(.on){color:var(--green)}
.combo-list .none{color:var(--faint);cursor:default}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;font-size:11.5px;cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--green)}
th.on{color:var(--green)}
td.num,th.num{text-align:right}
tbody tr:hover td{background:var(--panel2)}
tr.click{cursor:pointer}
td.wrapcell{white-space:normal;min-width:220px;max-width:340px}
.share{display:inline-block;height:6px;background:var(--green);border-radius:3px;vertical-align:middle;margin-right:8px;min-width:2px}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:5px;background:var(--input);border:1px solid var(--line);display:block}
.st{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--green-dim);color:var(--green)}
.st.out{border-color:rgba(255,176,32,.5);color:var(--amber)}
.more{display:flex;justify-content:center;margin-top:12px}

details.picker{position:relative}
details.picker summary{list-style:none}
details.picker summary::-webkit-details-marker{display:none}
.pick{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;z-index:20;width:min(360px,86vw);max-height:360px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.pick label{display:flex;gap:6px;align-items:center;cursor:pointer}
.pick input{accent-color:var(--green)}

.modal{position:fixed;inset:0;background:var(--backdrop);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal.dmodal .sheet{width:min(860px,100%);padding:16px 18px 12px}
.dnav{display:flex;align-items:center;gap:12px}
.dnav .btn{padding:10px 16px;font-size:14px}
.dnav .btn:disabled{opacity:.35;cursor:default}
.dnav #dNext:not(:disabled){border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.dpos{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.dpos b{color:var(--text)}
.dpos .g{color:var(--green)}
.dbody{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;margin-top:16px}
.dphoto{border:1px solid var(--line2);border-radius:12px;background:radial-gradient(ellipse at 50% 40%,var(--img-a),var(--img-b) 75%);aspect-ratio:3/4.2;display:grid;place-items:center;overflow:hidden}
.dphoto img{width:100%;height:100%;object-fit:contain}
.dinfo h3{margin:2px 0 4px;font-size:19px}
.dsub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.dkv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px;align-items:center}
.dkv span:nth-child(odd){color:var(--muted)}
.dkv span{word-break:break-word;min-height:1.45em}
.dkv .cp{margin-left:6px}
.dtag{display:inline-block;border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:2px 8px;font-weight:700}
.mono2{font-size:12px;color:var(--text)}
.dmore{margin-top:12px;font-size:12.5px}
.dmore summary{cursor:pointer;color:var(--muted)}
.dmore summary:hover{color:var(--green)}
.dmore .dkv{margin-top:8px}
.dfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.dfoot .btn{padding:11px 16px;font-size:14px}
.dadmin{text-decoration:none;color:var(--green);border-color:var(--green)}
.dsel.on{color:var(--text)}
.dhint{text-align:right;font-size:11.5px;color:var(--faint);margin-top:8px}
@media (max-width:700px){ .dbody{grid-template-columns:1fr} .dphoto{aspect-ratio:1;max-height:320px} .dkv{grid-template-columns:110px 1fr} }
.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--green-dim);border-radius:14px;padding:18px}
.sheet .top{display:flex;gap:16px;align-items:flex-start}
.sheet .top img{width:150px;height:150px;object-fit:contain;background:var(--input);border:1px solid var(--line);border-radius:10px}
.sheet h3{margin:0 0 4px;font-size:16px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 14px;font-size:12.5px;margin-top:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span{word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:var(--on-green);font-weight:700;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

/* result bar */
.rbar{position:sticky;top:0;z-index:6;display:flex;gap:10px 22px;align-items:center;flex-wrap:wrap;background:var(--bar);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin:28px 0 12px}
.rbar .t{font-size:15px;font-weight:800}
.rbar .t b{color:var(--green)}
.rbar .m{font-size:13px;color:var(--muted)}
.rbar .m b{color:var(--text);font-size:15px}
.rbar .m b.g{color:var(--green)}
.rbar .sel{color:var(--green);font-size:13px;border-left:1px solid var(--line2);padding-left:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clickme{display:inline-block;border:1.5px solid var(--green);color:var(--green);font-weight:800;font-size:12px;padding:5px 11px;border-radius:8px;text-decoration:none;white-space:nowrap}
.clickme:hover{background:var(--green);color:var(--on-green)}
.colhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.colhead h3{margin:0;font-size:18px}
.colfor{font-size:13px;color:var(--muted)}
.colfor b{color:var(--green)}
.colhelp{color:var(--muted);font-size:12.5px;margin:6px 0 14px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.colgrid label{display:flex;gap:9px;align-items:center;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;cursor:pointer;font-size:13.5px;background:var(--panel2)}
.colgrid label.on{border-color:var(--green);color:var(--text)}
.colgrid label:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 14px var(--glow)}
.colgrid input{accent-color:var(--green);width:16px;height:16px}
.colfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.colcount{font-size:13px;color:var(--muted);margin-right:6px}
.colcount b{color:var(--text)}
.rsearch{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:8px;background:var(--panel2)}
.rsearch:focus-within,.rsearch.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.rsearch .combo{border:0;border-right:1px solid var(--line2);border-radius:8px 0 0 8px;min-width:200px;box-shadow:none!important;background:none}
.rsearch input[type=search]{background:none;border:0;color:var(--text);font:inherit;font-size:13px;padding:6px 10px;width:220px}
.rsearch input[type=search]:focus{outline:none}
.evrange{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding-right:4px}
.evrange:focus-within,.evrange.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.evrange .rqnum{width:86px;background:none;border:0;color:var(--text);font:inherit;font-size:13px;padding:6px 8px;text-align:left}
.evrange .rqnum:focus{outline:none}
.evrange .rqnum.bad{color:var(--red)}
.evrange .dash{color:var(--faint)}
.evclr{background:none;border:0;color:var(--muted);font-size:16px;padding:0 6px;cursor:pointer}
.evclr:hover{color:var(--red)}
.rbar .of{color:var(--muted);font-weight:500;font-size:13px}
.sumgrid table{font-size:14px}
.sumgrid th{text-align:center;white-space:nowrap;text-transform:capitalize;font-size:15.5px;font-weight:700;color:var(--text);padding:15px 12px}
.sumgrid th .swd{width:19px;height:19px}
.sumgrid th.l,.sumgrid td.l{text-align:left}
.sumgrid td{text-align:center;padding:11px 12px}
.sumgrid td.l b{color:var(--green);font-size:15px}
.sumgrid td.l span{color:var(--muted);font-size:12.5px}
.sumgrid td.l span.r{color:var(--red);font-size:14px}
.sumgrid td.wt{color:var(--text);font-size:14px;font-weight:600}
.sumgrid .acref{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sumgrid .e{color:var(--faint)}
.sumgrid .tot{min-width:80px}
.sumgrid .big{font-size:17px;font-weight:800}
.sumgrid .g{color:var(--green)} .sumgrid .r{color:var(--red)} .sumgrid .z{color:var(--faint)}
.swd{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid #9aa0a6;vertical-align:middle;margin-right:6px}
.cell2{display:inline-flex;gap:7px;align-items:center;font:inherit;font-weight:800;font-size:14px;color:var(--text);background:var(--panel2);border:1.5px solid var(--line2);border-radius:9px;padding:6px 11px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.cell2 .g,.cell2 .r{font-size:12.5px}
.cell2.miss{border-color:rgba(255,92,92,.6)}
.cell2.mine{outline:2px dashed var(--green);outline-offset:3px}
.cell2:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 16px var(--glow)}
.dtitle{color:var(--text);font-weight:800;font-size:15px;margin-bottom:2px;text-transform:capitalize}
.dpos .r{color:var(--red)}
.dstrip{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px}
.dth{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:2px solid var(--line2);border-radius:10px;padding:4px;cursor:pointer;color:var(--muted);font:inherit}
.dth img{width:52px;height:52px;object-fit:contain;border-radius:6px;background:radial-gradient(ellipse at 50% 40%,var(--img-a),var(--img-b) 75%)}
.dth span{width:52px;height:52px;display:grid;place-items:center;color:var(--red);font-weight:800;font-size:20px;border-radius:6px;background:var(--input)}
.dth small{font-size:10.5px}
.dth.miss{border-color:rgba(255,92,92,.6)}
.dth.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 14px var(--glow);color:var(--text)}
.dth:hover{border-color:var(--green)}
.glab{display:inline-flex;align-items:center;gap:12px}
.gbadge{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);border:1.5px solid var(--line2);overflow:hidden}
.gbadge.mono{font-weight:800;font-size:12.5px;color:var(--text);letter-spacing:.02em}
.gbadge.logo{background:var(--panel2);border-color:var(--line2)}
.gbadge .lmask.wide{width:82%;height:82%}
.gbadge .lduo{position:relative;display:block;width:80%;height:80%}
.gbadge .lduo .lmask,.gbadge .lduo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gbadge .lmask{display:block;width:60%;height:60%;background:var(--text);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.gbadge.logo img{width:74%;height:74%;object-fit:contain}
.gtrack{flex:0 0 96px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.gtrack .share{display:block;height:100%;margin:0;border-radius:4px}
.colsearch{width:100%;background:var(--input);border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:6px}
.colsearch:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.colsec{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.colsec b{color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:0 8px;font-size:11.5px}
.collist2{display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow:auto;padding-right:4px}
.collist2.more{max-height:26vh;justify-content:flex-start;margin-top:0}
.crow{display:flex;align-items:center;gap:10px;touch-action:none;user-select:none;background:var(--panel2);border:1.5px solid var(--green-dim);border-radius:9px;padding:9px 10px;font-size:14px;font-weight:600;cursor:grab;transition:border-color .12s,box-shadow .12s}
.crow:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 14px var(--glow)}
.crow.off{border-color:var(--line2);color:var(--muted);cursor:default;font-weight:500}
.crow.off:hover{color:var(--text)}
.crow.dragging{opacity:.4}
.crow.dropbefore{box-shadow:0 -3px 0 0 var(--green)}
.crow.dropafter{box-shadow:0 3px 0 0 var(--green)}
.grip{color:var(--faint);letter-spacing:-3px;font-weight:800;cursor:grab}
.cname{flex:1}
.cbtn2{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;width:32px;height:28px;font-size:14px;cursor:pointer;display:grid;place-items:center}
.cbtn2.hide{filter:grayscale(1)}
.cbtn2:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 12px var(--glow)}
.cbtn2.add{color:var(--green);font-weight:800}
.cempty{color:var(--faint);font-size:13px;padding:6px 2px}
.modal.cmodal .sheet{width:min(1180px,100%);max-height:92vh;display:flex;flex-direction:column}
.colbody{display:grid;grid-template-columns:minmax(280px,1fr) minmax(360px,1.6fr);gap:22px;min-height:0;flex:1}
.colleft,.colright{display:flex;flex-direction:column;min-height:0}
.colbody .collist2,.colbody .collist2.more{max-height:58vh;flex:1}
.colsec em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint);font-size:12px;margin-left:auto}
@media (max-width:820px){ .colbody{grid-template-columns:1fr} .colbody .collist2,.colbody .collist2.more{max-height:34vh} }
.collist2 > *{flex-shrink:0}
.csec{margin-bottom:12px}
.csech{display:flex;align-items:center;gap:10px;margin:2px 0 6px;font-size:13px;font-weight:800;color:var(--green)}
.csech span{flex:1}
.csecadd{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;font:inherit;font-size:11.5px;font-weight:700;padding:3px 9px;cursor:pointer}
.csecadd:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 12px var(--glow)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.ctag{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;font-weight:600}
.secpills{display:flex;gap:8px;margin:26px 0 4px;flex-wrap:wrap}
.secpills button{background:var(--panel);border:2px solid var(--line2);color:var(--muted);font-weight:800;font-size:15px;padding:11px 22px;border-radius:999px;display:inline-flex;gap:8px;align-items:center}
.secpills button b{font-weight:600;font-size:13px;color:var(--faint)}
.secpills button:hover{border-color:var(--green-dim);color:var(--text)}
.secpills button.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.secpills button.on b{color:var(--on-green);opacity:.75}
.secbox[hidden]{display:none}
.secbox > .sh:first-child{margin-top:14px}
.secbox > .rbar:first-child{margin-top:14px}
.seg.segbig button{padding:8px 18px;font-size:14px;font-weight:700}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:6px 11px;font-size:12px}
.seg button.on{background:var(--green);color:var(--on-green);font-weight:700}

/* watch cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.wcard{border:2px solid var(--line2);border-radius:18px;background:var(--panel);padding:10px 10px 14px;display:flex;flex-direction:column}
.wcard.sel{border-color:var(--green);box-shadow:0 0 0 1px rgba(57,255,20,.25)}

.whead .ibtn{left:6px;border:2px solid var(--line2);background:var(--panel2);color:var(--muted)}

.wimg .none{color:var(--faint);font-size:12px}
.wbody{padding:14px 8px 0;display:flex;flex-direction:column;flex:1}
.wbrand{color:var(--green);font-weight:800;font-size:15px}
.wmodel{font-size:18px;font-weight:700;margin:6px 0 12px;line-height:1.25}
.wkv{display:grid;grid-template-columns:100px 1fr;gap:5px 10px;font-size:13.5px}
.wkv span:nth-child(odd){color:var(--muted)}
.wkv span{word-break:break-word}
.wac{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line2);font-size:15px}
.wac .ev{font-weight:800;font-size:16px}
.wkv.low{margin-top:12px;align-items:center}
.cp{display:inline-grid;place-items:center;width:26px;height:24px;margin-left:8px;border:1px solid var(--line2);border-radius:6px;background:none;color:var(--muted);vertical-align:middle;padding:0}
.cp:hover{border-color:var(--green);color:var(--green)}
.cp svg{width:12px;height:12px}
.wst{margin-top:12px;align-self:flex-start}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* hover glow on everything clickable */
:root{--glow:rgba(57,255,20,.45)}
:root[data-theme="light"]{--glow:rgba(30,143,10,.3)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--glow:rgba(30,143,10,.3)}}
.btn,.pills button,.tile,.secpills button,.seg button,.subtabs button,.sbtn,.ex button,.collist button,.clickme,.upick,.udel,.combo,.cp,.whead .ibtn,.dcard,.wcard,.chip button{transition:box-shadow .15s,border-color .15s,color .15s,background .15s}
.btn:hover:not(:disabled),.pills button:hover,.tile:hover,.secpills button:hover,.sbtn:hover,.ex button:hover,.collist button:hover,.clickme:hover,.upick:hover,.cp:hover,.whead .ibtn:hover,.combo:hover,details.picker summary:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 18px var(--glow)}
.btn.go:hover,.secpills button.on:hover,.tile.on:hover,.clickme:hover{color:var(--on-green)}
.tile.on:hover{color:var(--green)}
.btn.go:hover{box-shadow:0 0 0 1px var(--green),0 0 22px var(--glow)}
.seg button:hover,.subtabs button:hover{box-shadow:inset 0 0 0 1px var(--green),0 0 16px var(--glow);color:var(--green)}
.seg button.on:hover,.subtabs button.on:hover{color:var(--on-green)}
.udel:hover{box-shadow:0 0 0 1px var(--red),0 0 16px rgba(255,92,92,.4)}
@media (prefers-reduced-motion:reduce){.btn,.tile,.secpills button,.seg button{transition:none}}
/* glow on search, EV range and clear (×) buttons */
.rsearch,.evrange,.prompt .box{transition:box-shadow .15s,border-color .15s}
.rsearch:hover,.evrange:hover,.prompt .box:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 18px var(--glow)}
.evclr{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;transition:box-shadow .15s,color .15s,background .15s}
.evclr:hover{color:var(--green);background:var(--panel);box-shadow:0 0 0 1px var(--green),0 0 14px var(--glow)}
input[type=search]::-webkit-search-cancel-button{cursor:pointer;transition:filter .15s}
input[type=search]::-webkit-search-cancel-button:hover{filter:drop-shadow(0 0 5px var(--green)) drop-shadow(0 0 10px var(--glow))}
.chip button:hover{color:var(--green);text-shadow:0 0 8px var(--glow)}
/* larger table headers across the app */
th,table.gtable th{font-size:15px;font-weight:700;color:var(--text);padding-top:14px;padding-bottom:14px}
th:hover{color:var(--green)}
/* photos always fit inside their frame (whole watch visible, never cropped) */
.wimg,.dphoto,.dimg{position:relative}
.wimg img,.dphoto img,.dimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box}
.thumb{object-fit:contain}
</style>

<script>
(function(){ try { const t = localStorage.getItem("wc_theme"); if (t === "\"light\"" || t === "\"dark\"") document.documentElement.dataset.theme = JSON.parse(t); } catch {} })();
/* ============================== config ============================== */
const OUT_STATUSES = ['sold','shipped','delivered','archived','cancelled','canceled','returned','not_accepted','rejected'];
const ALIASES = {
  ref:['REFERENCE','REFERENCE_NUMBER','REF','WATCH_REFERENCE'], reference:'ref',
  ac:['AC_NUMBER','NUMBER','ITEM_NUMBER'], '8ac':'ac', item:'ac',
  po:['PO_NUMBER','PURCHASE_ORDER','PURCHASE_ORDER_NUMBER'],
  order:['ORDER_NUMBER','ORDER_ID'],
  ev:['ESTIMATED_VALUE','EV'], value:'ev',
  cost:['PURCHASE_COST','COST'],
  status:['ITEM_STATUS','STATUS'],
  brand:['BRAND_NAME','BRAND'],
  model:['MODEL','MODEL_NAME','NAME','TITLE'],
  dial:['DIAL_COLOR','DIAL_COLOUR','DIAL'], color:'dial', colour:'dial',
  size:['CASE_SIZE','CASE_SIZE_MM','CASE_DIAMETER','SIZE_MM','SIZE'],
  case:['CASE_MATERIAL'], material:'case',
  bracelet:['BRACELET_MATERIAL','BAND_MATERIAL','STRAP_MATERIAL','BRACELET'], strap:'bracelet',
  braceletcolor:['BRACELET_COLOR','BAND_COLOR','STRAP_COLOR'],
  condition:['CONDITION','ITEM_CONDITION'],
  box:['BOX','HAS_BOX','BOX_TYPE'], papers:['PAPERS','HAS_PAPERS','PAPERS_TYPE'],
  movement:['MOVEMENT','MOVEMENT_TYPE'], gender:['GENDER'],
  tag:['TAG','TAGS','TAG_NAME','TAG_NAMES'], bin:['BIN','BIN_NAME','BIN_LABEL'], vault:['VAULT','VAULT_NAME'], source:['SOURCE'],
  weight:['WEIGHT_G','WEIGHT_GRAMS','WEIGHT','WEIGHT_OZ','WEIGHT_LBS'], grams:'weight',
  height:['HEIGHT_MM','HEIGHT','THICKNESS_MM','THICKNESS','CASE_THICKNESS_MM'], thickness:'height',
  width:['WIDTH_MM','WIDTH','CASE_WIDTH_MM','CASE_WIDTH'],
  length:['LENGTH_MM','LENGTH','LUG_TO_LUG_MM','LUG_TO_LUG'], lug:'length'
};
const EXACT_BY_DEFAULT = new Set(['ref','ac','po','order']);
const SOURCE_NAME = { warehouse:'Warehouse', retrieved:'Retrieved', all:'All' };
const SOURCES = ['warehouse', 'retrieved', 'all'];
const SERVER_TAG = { ref:'reference_number', ac:'ac_number', po:'po_number', order:'order_number', model:'model' };
const STOP = new Set(['show','me','find','all','the','a','an','with','and','of','for','watch','watches','that','are','have','we','in','list','get']);
const EXAMPLES = ['rolex steel bracelet white dial','all rolexes $400-$5000','weight 120-160 rolex','order 20575379','ac 4220749 3302372','ref 14000','rolex omega black dial','under $1,000 group:brand','condition excellent box original'];
const PAGE = { cards:60, table:300 };
const DEFAULT_VISIBLE = ['IMAGE','AC','BRAND','MODEL','REF','DIAL','STATUS','EV','COST','PO'];

/* ============================== state ============================== */
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const S = {
  cols:[], all:[], rows:[], filtered:[], parsed:null, groupCol:null, sortCol:null, sortDir:-1,
  pages:1, view:null, source:null, sources:{}, section:null, sel:new Set(), visible:null, imgCol:null, urlCol:null, loaded:false
};

/* ============================== helpers ============================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc = v => (v == null ? '' : String(v)).trim().toLowerCase();
const norm = v => lc(v).replace(/[^a-z0-9]/g, '');
const money = n => (n == null || isNaN(n)) ? '—' : '$' + Math.round(n).toLocaleString('en-US');
const pretty = c => c.toLowerCase().replace(/_/g,' ');
function num(v){
  if (v == null || v === '' || typeof v === 'boolean') return null;
  const n = Number(String(v).replace(/[$,\s]/g,''));
  return Number.isFinite(n) ? n : null;
}
function parseNum(s){
  const m = String(s).trim().replace(/[$,]/g,'').match(/^(-?\d*\.?\d+)\s*([kKmM]?)$/);
  if (!m) return null;
  return Number(m[1]) * (m[2] ? ({k:1e3,m:1e6}[m[2].toLowerCase()]) : 1);
}
const isMoneyCol = c => /VALUE|COST|PRICE|AMOUNT|(^|_)EV($|_)/.test(c);
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1400); }

function resolveAlias(name){
  let a = ALIASES[name]; if (typeof a === 'string') a = ALIASES[a];
  return a ? a.find(c => S.cols.includes(c)) || null : null;
}
function aliasKey(name){ const a = ALIASES[name]; return typeof a === 'string' ? a : (a ? name : null); }
function resolveCol(key){
  const k = key.toLowerCase();
  const viaAlias = resolveAlias(k); if (viaAlias) return viaAlias;
  const K = key.toUpperCase().replace(/[^A-Z0-9]+/g,'_');
  if (S.cols.includes(K)) return K;
  const n = K.replace(/_/g,'');
  return S.cols.find(c => c.replace(/_/g,'') === n) || S.cols.find(c => c.replace(/_/g,'').startsWith(n)) || S.cols.find(c => c.replace(/_/g,'').includes(n)) || null;
}
const colFor = short => resolveAlias(short);
function display(col, v){
  if (v == null || v === '') return '';
  if (isMoneyCol(col) && num(v) != null) return money(num(v));
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (num(v) != null && /(_MM|MILLIMETER)/.test(col)) return `${+num(v).toFixed(1)} mm`;
  if (num(v) != null && /(WEIGHT_G$|GRAMS)/.test(col)) return `${+num(v).toFixed(1)} g`;
  const s = String(v);
  if (/^\d{4}-\d\d-\d\dT/.test(s)) return s.slice(0,10);
  return s;
}

function indexRow(o){
  const vals = S.cols.map(c => o[c]).filter(v => v != null && v !== '').map(String);
  o._s = vals.join(' \u0001 ').toLowerCase();
  o._n = vals.map(norm).join('\u0001');
  return o;
}
function addCols(cols){ cols.forEach(c => { if (!S.cols.includes(c)) S.cols.push(c); }); }
// The warehouse and retrieved questions may name the same thing differently (IMAGE_URL vs PHOTO_URL,
// REFERENCE vs REFERENCE_NUMBER…). Copy each value into the one column the app reads, so a shipped/retrieved
// watch with a photo still counts as having a photo, and refs/dials group across both questions.
const IMG_COL_RE = /IMAGE|PHOTO|THUMB|PICTURE|(^|_)IMG(_|$)/;
const isUrl = v => /^(https?:|data:image)/.test(String(v || '').trim());
function unifyRows(rows){
  const keys = Object.keys(ALIASES).filter(k => Array.isArray(ALIASES[k]));
  const plan = keys.map(k => { const main = colFor(k); return main ? [main, ALIASES[k].filter(c => c !== main && S.cols.includes(c))] : null; }).filter(x => x && x[1].length);
  const imgCols = S.cols.filter(c => IMG_COL_RE.test(c) && c !== S.imgCol);
  rows.forEach(r => {
    plan.forEach(([main, others]) => { if (r[main] == null || r[main] === ''){ const c = others.find(o => r[o] != null && r[o] !== ''); if (c) r[main] = r[c]; } });
    if (S.imgCol && !isUrl(r[S.imgCol])){ const c = imgCols.find(o => isUrl(r[o])); if (c) r[S.imgCol] = String(r[c]).trim(); }
  });
}
function toObjects(j, source){
  const cols = j.cols;
  addCols(cols.concat('SOURCE'));
  return j.rows.map(a => { const o = {}; cols.forEach((c,i) => { if (!(c in o)) o[c] = a[i]; }); o.SOURCE = source; return indexRow(o); });

/* ============================== prompt parser ============================== */
const FIELD_WORDS = 'ref|reference|8ac|ac|po|order|brand|model|status|tag|bin|condition|gender|movement|source|vault';
const ID_FIELDS = new Set(['ref','ac','po','order']);
// watch parts → the columns that describe them
const PART_WORDS = { bracelet:['BRACELET','STRAP','BAND'], dial:['DIAL'], case:['CASE'], bezel:['BEZEL'], movement:['MOVEMENT','CALIBER','CALIBRE'], crystal:['CRYSTAL','GLASS'], hands:['HANDS'] };
function partKey(word){
  const w = lc(word).replace(/s$/, '');
  return w === 'strap' || w === 'band' ? 'bracelet' : w === 'hand' ? 'hands' : w;
}
function partCols(key){
  const stems = PART_WORDS[key] || [key.toUpperCase()];
  return S.cols.filter(c => stems.some(s => c.includes(s)) && !/URL|IMAGE/.test(c) && !S.all.every(r => r[c] == null || r[c] === '' || num(r[c]) != null));
}
function quoteMultiWordValues(q){
  const col = colFor('brand'); if (!col || !S.all.length) return q;
  if (!quoteMultiWordValues.list || quoteMultiWordValues.n !== S.all.length){
    quoteMultiWordValues.list = [...new Set(S.all.map(r => lc(r[col])).filter(v => /\s/.test(v)))].sort((a, b) => b.length - a.length);
    quoteMultiWordValues.n = S.all.length;
  }
  const parts = q.split(/("[^"]*")/);   // leave text already in quotes alone
  return parts.map((part, i) => i % 2 ? part : quoteMultiWordValues.list.reduce((s, v) => {
    const re = new RegExp(`(^|[\\s-])(${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')})(?=[\\s.,]|$)`, 'gi');
    return s.replace(re, (m, pre, val) => `${pre}"${val}"`);
  }, part)).join('');
}
function preprocess(raw){
  let q = ' ' + String(raw || '').replace(/[\r\n\t]+/g, ' ') + ' ';
  // multi-word values (brands like "grand seiko", "jack mason", "tag heuer") are kept together as one phrase
  q = quoteMultiWordValues(q);
  // "<value> <watch part>" → search every column for that part:
  // "steel bracelet" (bracelet material/colour/type), "white dial" (dial colour/style), "gold case", "ceramic bezel"
  q = q.replace(/(^|\s)(-?)("[^"]+"|[a-z][\w-]*)\s+(bracelets?|straps?|bands?|dials?|cases?|bezels?|movements?|crystals?|hands?)(?=[\s.,]|$)/gi, (m, pre, neg, v, part) => {
    const val = v.replace(/^"|"$/g, '');
    if (STOP.has(val.toLowerCase()) || /^\d/.test(val)) return m;
    const key = partKey(part), cols = partCols(key);
    if (!cols.length) return m;
    const lv = lc(val), nv = norm(val);
    const exists = S.all.some(r => cols.some(c => lc(r[c]).replace(/_/g, ' ').includes(lv) || (nv && norm(r[c]).includes(nv))));
    return exists ? `${pre}${neg}${key}__part:${v}` : m;
  });
  // "order number 123" / "ac no. 123" / "ref # 123" / "8ac number 123"
  q = q.replace(/\b(order|8ac|ac|po|ref|reference|item)\s*(?:number|num|nos?\.?|#)(?=\s|\d)/gi, '$1 ');
  // money phrases -> $a-$b, ev<=, ev>=
  const AMT = '([\\d.,]+\\s*[kKmM]?)';
  const clean = s => s.replace(/\s/g, '').replace(/[.,]+$/, '');
  q = q.replace(new RegExp(`\\bbetween\\s+\\$?\\s*${AMT}\\s+and\\s+\\$?\\s*${AMT}`, 'gi'), (m, a, b) => ` $${clean(a)}-$${clean(b)} `);
  q = q.replace(new RegExp(`\\$\\s*${AMT}\\s*(?:-|–|to)\\s*\\$?\\s*${AMT}`, 'gi'), (m, a, b) => ` $${clean(a)}-$${clean(b)} `);
  q = q.replace(new RegExp(`\\b(?:under|below|less than|max|up to)\\s+\\$\\s*${AMT}`, 'gi'), (m, a) => ` ev<=${clean(a)} `);
  q = q.replace(new RegExp(`\\b(?:over|above|more than|min|at least)\\s+\\$\\s*${AMT}`, 'gi'), (m, a) => ` ev>=${clean(a)} `);
  // "<any column name> <value>" → column:value, e.g. "case size 40", "bracelet color silver", "weight 80-120"
  q = naturalColumns(q);
  // field + value(s): "ref 14000", "ac 4220749, 3302372", "brand rolex or omega"
  const V = '(?:"[^"]+"|#?[^\\s:=<>,"|]+)';
  q = q.replace(new RegExp(`\\s(-?)(${FIELD_WORDS})(?![:=<>!])\\s+(${V}(?:\\s*(?:,|\\bor\\b)\\s*${V})*)(?=[\\s,]|$)`, 'gi'), (m, neg, f, vals) => {
    const list = vals.split(/\s*(?:,|\bor\b)\s*/i).map(v => v.replace(/^#/, '')).filter(Boolean);
    if (!list.length || STOP.has(list[0].toLowerCase())) return m;
    return ` ${neg}${f}:${list.join('|')}`;
  });
  // ID fields swallow more IDs separated by spaces: "ac 4220749 3302372 4300009"
  q = q.replace(/(\s-?(?:ref|reference|8ac|ac|po|order):)(\S+)((?:\s+#?[A-Za-z0-9.\-\/]*\d[A-Za-z0-9.\-\/]*)+)(?=\s)/gi,
    (m, a, b, rest) => a + b + '|' + rest.trim().split(/\s+/).map(x => x.replace(/^#/, '').replace(/[.,]+$/, '')).join('|'));
  return q.replace(/\s+/g, ' ').trim();
}

function naturalColumns(q){
  if (!S.cols.length) return q;
  const phrases = [];
  S.cols.forEach(c => { phrases.push([pretty(c), c]); const short = pretty(c).replace(/ (name|number|color|colour|material|status|url)$/, ''); if (short !== pretty(c)) phrases.push([short, c]); });
  Object.keys(ALIASES).forEach(a => { const c = resolveAlias(a); if (c) phrases.push([a, c]); });
  phrases.sort((a, b) => b[0].length - a[0].length);
  const esc2 = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const isNum = c => S.all.some(r => num(r[c]) != null) && S.all.filter(r => r[c] != null && r[c] !== '').every(r => num(r[c]) != null);
  const handledLater = new Set(FIELD_WORDS.split('|'));
  for (const [ph, c] of phrases){
    if (handledLater.has(ph)) continue;
    const re = new RegExp(`\\s(-?)${esc2(ph).replace(/ /g, '\\s+')}\\s+(?![:=])("[^"]+"|[<>]=?\\s*[\\d.,]+[kKmM]?|[\\d.,]+[kKmM]?\\s*-\\s*[\\d.,]+[kKmM]?|[^\\s:=<>"]+)(?=\\s)`, 'gi');
    q = q.replace(re, (m, neg, val) => {
      const v = val.replace(/^"|"$/g, '').replace(/\s+/g, '');
      if (isNum(c)){
        if (/^[<>]=?/.test(v)) return ` ${neg}${c.toLowerCase()}${v}`;
        if (parseNum(v) != null || /^[\d.,]+[kKmM]?-[\d.,]+[kKmM]?$/.test(v)) return ` ${neg}${c.toLowerCase()}:${v}`;
        return m;
      }
      const lv = lc(val.replace(/^"|"$/g, ''));
      if (STOP.has(lv)) return m;
      const exists = S.all.some(r => lc(r[c]).replace(/_/g, ' ').includes(lv) || norm(r[c]).includes(norm(lv)));
      return exists ? ` ${neg}${c.toLowerCase()}:${val}` : m;
    });
  }
  return q;
}

// which column has this word as one of its values (brand first, then dial, status…)
function valueColumn(word){
  const w = lc(word), cache = valueColumn.cache;
  if (!cache || cache.n !== S.all.length){
    const cols = ['brand','dial','status','condition','gender','movement','case','bracelet','source'].map(colFor).filter(Boolean);
    valueColumn.cache = { n: S.all.length, cols: cols.map(c => [c, new Set(S.all.map(r => lc(r[c]).replace(/_/g,' ')).filter(Boolean))]) };
    valueColumn.hit = {};
  }
  for (const [c, set] of valueColumn.cache.cols){
    if (set.has(w)) { valueColumn.hit[w] = w; return c; }
    // a brand typed by its first word or in plural ("tag" → TAG Heuer, "rolexes" → Rolex)
    if (c === colFor('brand')){
      const sing = w.replace(/(es|s)$/, '');
      for (const v of set){ if (v === sing || v.split(' ')[0] === w && w.length > 3){ valueColumn.hit[w] = v; return c; } }
    }
  }
  return null;
}

function kwFilter(word, neg, raws){
  const v = word.toLowerCase();
  const f = { kind:'kw', v, neg, raws, variants:[v] };
  if (/^[a-z]{4,}$/.test(v)){
    if (v.endsWith('es')) f.variants.push(v.slice(0, -2));
    if (v.endsWith('s')) f.variants.push(v.slice(0, -1));
  }
  // a bare number that is exactly an AC / order / ref / PO matches that ID only
  if (/\d/.test(v) && norm(v).length >= 4){
    const cols = ['ac','order','ref','po'].map(colFor).filter(Boolean);
    const nv = norm(v);
    const hitCols = cols.filter(c => S.all.some(r => norm(r[c]) === nv));
    if (hitCols.length) f.idExact = hitCols;
  }
  return f;
}

function parse(raw){
  const q = preprocess(raw);
  const tokens = q.match(/-?[\w.]+(?:>=|<=|!=|:|=|>|<)"[^"]*"|-?"[^"]*"|\S+/g) || [];
  const out = { filters:[], group:null, sort:null, warnings:[], tokens, groupRaw:null, sortRaw:null };
  let pendingOr = false;

  for (let tok of tokens){
    const rawTok = tok;
    if (/^or$/i.test(tok)){ pendingOr = true; continue; }
    tok = tok.replace(/(?<=[\w"%])[.,;!?]+$/, '');
    let neg = false;
    if (tok.length > 1 && tok[0] === '-' && !/^-\d/.test(tok)) { neg = true; tok = tok.slice(1); }

    let m = tok.match(/^\$([\d.,]+[kKmM]?)\s*-\s*\$?([\d.,]+[kKmM]?)$/) || tok.match(/^\$([\d.,]+[kKmM]?)\+$/);
    if (m){
      const ev = colFor('ev'); const a = parseNum(m[1]); const b = m[2] != null ? parseNum(m[2]) : Infinity;
      if (ev && a != null){ out.filters.push({ kind:'field', col:ev, key:'ev', op:'range', a, b, neg, raws:[rawTok] }); pendingOr = false; continue; }
    }
    m = tok.match(/^([\w.]+)(>=|<=|!=|:|=|>|<)(.*)$/);
    if (m && m[3] !== ''){
      const [ , key, op ] = m; let val = m[3].replace(/^"|"$/g, '');
      const k = key.toLowerCase() === '8ac' ? 'ac' : key.toLowerCase();
      if (k === 'group' || k === 'by' || k === 'groupby'){
        const c = resolveCol(val); c ? (out.group = c, out.groupRaw = rawTok) : out.warnings.push(`No column “${val}” to group by`); continue;
      }
      if (k === 'sort'){
        const parts = val.split(':'); const c = resolveCol(parts[0]);
        c ? (out.sort = { col:c, dir: /^asc/i.test(parts[1] || '') ? 1 : -1 }, out.sortRaw = rawTok) : out.warnings.push(`No column “${parts[0]}” to sort by`);
        continue;
      }
      if (k.endsWith('__part')){
        const key = k.slice(0, -6), cols = partCols(key);
        const vals = val.split('|').map(s => s.trim()).filter(Boolean);
        const items = cols.map(c => ({ kind:'field', col:c, key:c.toLowerCase(), op:'has', vals:[...vals], neg:false, raws:[] }));
        out.filters.push({ kind:'any', part:key, vals, items, neg, raws:[rawTok] });
        pendingOr = false; continue;
      }
      const col = resolveCol(k);
      if (col){
        const short = aliasKey(k);
        const f = { kind:'field', col, key: short || k, neg: neg || op === '!=', raws:[rawTok] };
        const r = val.match(/^\$?([\d.,]+[kKmM]?)\s*-\s*\$?([\d.,]+[kKmM]?)$/);
        if ((op === ':' || op === '=') && r && parseNum(r[1]) != null && parseNum(r[2]) != null && !ID_FIELDS.has(short)){
          Object.assign(f, { op:'range', a:parseNum(r[1]), b:parseNum(r[2]) });
        } else if (['>','<','>=','<='].includes(op)){
          const n = parseNum(val); if (n == null){ out.warnings.push(`“${rawTok}” needs a number`); continue; }
          Object.assign(f, { op, a:n });
        } else {
          let exact = op === '=' || op === '!=' || ID_FIELDS.has(short);
          if (val.includes('*')){ exact = false; val = val.replace(/\*/g, ''); }
          Object.assign(f, { op: exact ? 'eq' : 'has', vals: val.split('|').map(s => s.trim().replace(/[.,]+$/, '')).filter(Boolean) });
        }
        out.filters.push(f); pendingOr = false; continue;
      }
      out.warnings.push(`No column “${key}”, searched as a keyword`);
      tok = tok.replace(/[:=<>!]+/g, ' ');
    }
    const word = tok.replace(/^"|"$/g, '').trim();
    if (!word || (!neg && STOP.has(word.toLowerCase()))) { pendingOr = false; continue; }
    const f = kwFilter(word, neg, [rawTok]);
    const last = out.filters[out.filters.length - 1];
    if (pendingOr && !neg && last && !last.neg && (last.kind === 'kw' || last.kind === 'any')){
      if (last.kind === 'kw') out.filters[out.filters.length - 1] = { kind:'any', items:[last, f], neg:false, raws:[...last.raws, 'or', rawTok] };
      else { last.items.push(f); last.raws.push('or', rawTok); }
    } else out.filters.push(f);
    pendingOr = false;
  }

  // plain words that are values of the same column mean "any of these":
  // "rolex omega black dial" → brand is Rolex or Omega, and dial is black
  const byCol = new Map();
  [...out.filters].forEach(f => {
    if (f.kind !== 'kw' || f.neg || f.idExact) return;
    const col = valueColumn(f.v); if (!col) return;
    // joins a filter already on that column ("black blue dial" → dial is black or blue)
    const part = out.filters.find(g => g.kind === 'any' && g.part && !g.neg && partCols(g.part).includes(col));
    if (part){ const v = valueColumn.hit[f.v] || f.v; if (part.vals.includes(v)) { out.filters = out.filters.filter(g => g !== f); return; } part.vals.push(v); part.items.forEach(i => i.vals.push(v)); part.raws.push(...f.raws); out.filters = out.filters.filter(g => g !== f); return; }
    const same = out.filters.find(g => g.kind === 'field' && g.col === col && !g.neg && g.vals);
    if (same){ same.vals.push(valueColumn.hit[f.v] || f.v); same.raws.push(...f.raws); out.filters = out.filters.filter(g => g !== f); return; }
    if (!byCol.has(col)) byCol.set(col, []);
    byCol.get(col).push(f);
  });
  byCol.forEach((list, col) => {
    if (list.length < 2) return;
    const at = out.filters.indexOf(list[0]);
    out.filters = out.filters.filter(f => !list.includes(f));
    out.filters.splice(at, 0, { kind:'field', col, key: aliasKey(Object.keys(ALIASES).find(a => resolveAlias(a) === col) || '') || col.toLowerCase(), op:'eq', vals: list.map(f => valueColumn.hit[f.v] || f.v), neg:false, raws: list.flatMap(f => f.raws) });
  });

  // several bare IDs pasted together (ACs, orders, refs) mean "any of these"
  const ids = out.filters.filter(f => f.kind === 'kw' && !f.neg && f.idExact);
  if (ids.length >= 2){
    out.filters = out.filters.filter(f => !ids.includes(f));
    out.filters.unshift({ kind:'any', items:ids, neg:false, raws: ids.flatMap(f => f.raws) });
  }
  return out;
}

function test(row, f){
  let hit;
  if (f.kind === 'any'){
    hit = f.items.some(i => test(row, i));
  } else if (f.kind === 'kw'){
    if (f.idExact){ const nv = norm(f.v); hit = f.idExact.some(c => norm(row[c]) === nv); }
    else hit = f.variants.some(v => row._s.includes(v) || (norm(v).length > 1 && row._n.includes(norm(v))));
  } else {
    const raw = row[f.col];
    if (f.op === 'range' || ['>','<','>=','<='].includes(f.op)){
      const n = num(raw);
      hit = n != null && (f.op === 'range' ? n >= f.a && n <= f.b : f.op === '>' ? n > f.a : f.op === '<' ? n < f.a : f.op === '>=' ? n >= f.a : n <= f.a);
    } else if (f.op === 'eq'){
      const l = lc(raw), n = norm(raw);
      hit = f.vals.some(v => l === v.toLowerCase() || (norm(v) && n === norm(v)));
    } else {
      const l = lc(raw), n = norm(raw);
      hit = f.vals.some(v => l.includes(v.toLowerCase()) || (norm(v) && n.includes(norm(v))));
    }
  }
  return f.neg ? !hit : hit;
}

function describe(f){
  if (f.kind === 'any' && f.part) return `${esc(f.part)} <em>${f.neg ? 'is not' : 'is'}</em> ${f.vals.map(v => '“' + esc(v) + '”').join(' or ')}`;
  if (f.kind === 'any'){
    if (f.items.every(i => i.idExact)) return `<em>${f.items.length} IDs:</em> ${f.items.map(i => esc(i.v)).join(', ')}`;
    return f.items.map(describe).join(' <em>or</em> ');
  }
  if (f.kind === 'kw'){
    if (f.idExact) return `${f.idExact.map(c => esc(pretty(c))).join(' / ')} <em>${f.neg ? 'is not' : 'is'}</em> “${esc(f.v)}”`;
    return `<em>${f.neg ? 'without' : 'has'}</em> “${esc(f.v)}”${f.variants.length > 1 ? ` <em>or</em> “${esc(f.variants[1])}”` : ''}`;
  }
  const c = esc(pretty(f.col));
  if (f.op === 'range') return `${c} <em>${f.neg ? 'not ' : ''}${f.b === Infinity ? '≥' : 'between'}</em> ${isMoneyCol(f.col) ? money(f.a) : f.a}${f.b === Infinity ? '' : '–' + (isMoneyCol(f.col) ? money(f.b) : f.b)}`;
  if (f.vals) return `${c} <em>${f.neg ? 'is not' : f.op === 'eq' ? 'is' : 'contains'}</em> ${f.vals.length > 3 ? `any of ${f.vals.length}: ` : ''}${f.vals.slice(0, 6).map(v => '“' + esc(v) + '”').join(f.vals.length > 3 ? ', ' : ' or ')}${f.vals.length > 6 ? '…' : ''}`;
  return `${c} <em>${f.neg ? 'not ' : ''}${esc(f.op)}</em> ${isMoneyCol(f.col) ? money(f.a) : f.a}`;
}

/* ============================== Image tab ============================== */
S.img = { input:'', view:'summary', missingOnly:false };
// ---------- reference lookup (copy/paste friendly) ----------
const acKey = r => { const c = colFor('ac'); return c && r[c] != null && r[c] !== '' ? 'ac:' + norm(r[c]) : 'row:' + r._s; };
function imgPool(){
  const n = S.all.length + (S.img.extra ? S.img.extra.length : 0);
  if (S._pool && S._pool.n === n) return S._pool.rows;
  const seen = new Set(), rows = [];
  const add = r => { const k = acKey(r); if (!seen.has(k)){ seen.add(k); rows.push(r); } };
  S.all.filter(r => r.SOURCE === 'all').forEach(add);
  S.all.filter(r => r.SOURCE !== 'all').forEach(add);
  (S.img.extra || []).forEach(add);
  S._pool = { n, rows };
  return rows;
}
// every column that can hold a reference number
function refCols(){
  const main = colFor('ref');
  const extra = S.cols.filter(c => c !== main && /^(REFERENCE|REF|REFERENCE_NUMBER|REFERENCE_NO|REF_NUMBER|REF_NO|WATCH_REFERENCE|MODEL_NUMBER|MODEL_NO)$/.test(c));
  return [main, ...extra].filter(Boolean);
}
// exact first, then "starts with" (126610 → 126610LN), then "contains" (M14000-0001 ↔ 14000).
// Loose matches never split a number: 14000 won't match 140000 or 114000.
function within(outer, inner){
  if (inner.length < 4) return false;
  let i = outer.indexOf(inner);
  while (i !== -1){
    const before = outer[i - 1], after = outer[i + inner.length];
    if (!/[0-9]/.test(before || '') && !/[0-9]/.test(after || '')) return true;
    i = outer.indexOf(inner, i + 1);
  }
  return false;
}
function matchRef(id){
  const nv = norm(id); if (nv.length < 3) return null;
  const raw = String(id).toUpperCase().replace(/\s+/g, '');
  const cols = refCols(), pool = imgPool();
  const tiers = [
    (v) => v === nv,
    (v) => (v.startsWith(nv) && /[a-z]/.test(v[nv.length] || '')) || (v.length >= 5 && nv.startsWith(v) && /[a-z]/.test(nv[v.length] || '')),
    (v, rv) => within(raw, rv) || within(rv, raw)
  ];
  for (let t = 0; t < tiers.length; t++){
    const use = t === 0 ? cols : cols.slice(0, 1);          // close matches only on the main Reference column
    const rows = pool.filter(r => use.some(c => { const v = norm(r[c]); return v && tiers[t](v, String(r[c]).toUpperCase().replace(/\s+/g, '')); }));
    if (rows.length) return { rows, how: ['exact', 'starts with', 'contains'][t], col: use.find(c => rows.some(r => norm(r[c]))) };
  }
  return null;
}
// one reference per line (or separated by commas, semicolons or tabs — straight from Excel/Sheets)
function parseIdList(text){
  const lines = String(text || '').replace(/\u00a0/g, ' ').split(/[\r\n,;\t]+/)
    .map(l => l.replace(/\b(?:reference|ref|8ac|ac|number|num|no)\b\.?:?|#/gi, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const out = [], seen = new Set();
  const add = w => { w = w.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, ''); const k = norm(w); if (k && !seen.has(k)){ seen.add(k); out.push(w); } };
  lines.forEach(l => {
    if (!/\s/.test(l) || matchRef(l)) add(l);            // keep "01 733 7766 4135" whole when it is a real ref
    else l.split(' ').forEach(add);                       // otherwise several refs on one line
  });
  return out;
}
function hasImg(r){ return (S.imgCol && isUrl(r[S.imgCol])) || S.cols.some(c => IMG_COL_RE.test(c) && isUrl(r[c])); }
// same ref + same dial colour = a match: one photo covers every watch of that ref/dial
const matchKey = r => norm(r[colFor('ref')]) + '|' + lc(r[colFor('dial')]);
function coverSet(){
  const pool = imgPool();
  if (S._cover && S._cover.n === pool.length) return S._cover.set;
  const set = new Set(); pool.forEach(r => { if (hasImg(r) && norm(r[colFor('ref')])) set.add(matchKey(r)); });
  S._cover = { n: pool.length, set }; return set;
}
function covered(r){ return hasImg(r) || (norm(r[colFor('ref')]) !== '' && coverSet().has(matchKey(r))); }
const imgState = r => hasImg(r) ? '<span class="yes">✓ YES</span>' : covered(r) ? '<span class="yes" title="Another watch with the same ref and dial has a photo">✓ MATCH</span>' : '<span class="no">✗ NO</span>';
function lookupIds(ids){
  const ac = colFor('ac'), order = colFor('order'), ref = colFor('ref'), pool = imgPool();
  const out = [];
  ids.forEach(id => {
    const m = matchRef(id);
    if (m){
      // a loose match can hit several refs (14000 → 14000, 14000M): one row each
      const groups = new Map();
      m.rows.forEach(r => { const k = norm(r[ref]) || norm(id); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
      groups.forEach(rows => out.push({ id, type:'Ref', how:m.how, col:m.col, rows }));
      return;
    }
    for (const [col, type] of [[ac,'AC'], [order,'Order']]){
      if (!col) continue;
      const rows = pool.filter(r => norm(r[col]) === norm(id));
      if (rows.length){ out.push({ id, type, rows }); return; }
    }
    out.push({ id, type:null, rows:[] });
  });
  return out;
}
// refs not in the loaded rows: ask Metabase directly — the warehouse/retrieved questions if they have a Reference
// filter, plus the all-items lookup question (LOOKUP_CARD_ID) which also finds shipped/sold watches
async function fetchMissingRefs(ids){
  if (DEMO || !ids.length) return false;
  S.img.tried = S.img.tried || new Set(); S.img.extra = S.img.extra || [];
  const todo = ids.filter(id => !S.img.tried.has(norm(id))).slice(0, 40);
  if (!todo.length) return false;
  // the all-items question is always searched by reference (the server adds the filter if the question has none)
  const srcs = Object.keys(S.sources).filter(s => s !== 'all' && S.sources[s].filters.has('reference_number'));
  if (S.img.lookup !== 'off') srcs.push('lookup');
  todo.forEach(id => S.img.tried.add(norm(id)));
  const have = new Set(imgPool().map(acKey));
  const jobs = srcs.flatMap(s => s === 'lookup'
    ? [api({ reference_numbers: todo }, s).then(j => toObjects(j, s))]          // one request for all missing refs
    : todo.map(id => api({ reference_number: id }, s).then(j => toObjects(j, s))));
  const res = await Promise.allSettled(jobs);
  let added = 0;
  res.forEach(r => {
    if (r.status === 'fulfilled'){ unifyRows(r.value); r.value.forEach(o => { const k = acKey(o); if (!have.has(k)){ have.add(k); S.img.extra.push(o); added++; } }); }
    else if (/LOOKUP_CARD_ID|Reference filter/.test(r.reason && r.reason.message || '')){ S.img.lookup = 'off'; S.img.lookupWhy = r.reason.message; }
  });
  if (!res.some(r => r.status === 'rejected' && /LOOKUP_CARD_ID|Reference filter/.test(r.reason && r.reason.message || '')) && srcs.includes('lookup')) S.img.lookup = 'on';
  S._cover = null;
  S.img.checked = true;
  return added > 0 || true;
}

    </div>
    ${res.length ? `<details class="idiag"><summary>How refs were matched</summary><div>Reference column${refCols().length > 1 ? 's' : ''} searched: <b>${esc(refCols().join(', ') || 'none found')}</b> · rows searched: <b>${imgPool().length.toLocaleString()}</b> (${Object.entries(S.sources).map(([s, v]) => `${SOURCE_NAME[s]} ${v.card}: ${v.count.toLocaleString()}${v.note ? ` <span class="part">— ${esc(v.note)}</span>` : ''}`).join(' · ')}${S.img.extra && S.img.extra.length ? ` · ${S.img.extra.length} found by Metabase look-up` : ''})</div>
      <table class="idiagt"><tr><th>Pasted</th><th>Matched</th><th>How</th><th>Watches</th></tr>${res.map(x => `<tr><td>${esc(x.id)}</td><td>${x.rows.length ? esc(String(x.rows[0][colFor('ref')] ?? '')) : '—'}</td><td>${x.rows.length ? esc(x.type === 'Ref' ? x.how : 'by ' + x.type) : '<span class="no">not found</span>'}</td><td>${x.rows.length}</td></tr>`).join('')}</table></details>` : ''}
    <div id="imgOut">${!res.length ? '<div class="msg">Paste references above, then Look up. Checks every dial variant of each reference across all items (question 31879), warehouse and retrieved.</div>' : S.img.view === 'summary' ? imageSummary(res) : S.img.view === 'list' ? imageList(res) : imageFull(res)}</div>
  </section>`;
  const go = () => { S.img.input = $('imgIn').value; renderImageTab(); };

    S.img.fetching = true;
    fetchMissingRefs(missing).then(found => { S.img.fetching = false; if (found && S.source === 'image' && missing.some(id => !S.img.drawnAfter?.has(norm(id)))){ S.img.drawnAfter = new Set([...(S.img.drawnAfter || []), ...missing.map(norm)]); renderImageTab(); } }).catch(() => { S.img.fetching = false; });
  }

  $('imgIn').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go(); } });

    S.img.input = ['14000', '16610', '79030N', 'WSTA0041', 'SRPB43', '99999'].join('\n');

  document.querySelectorAll('[data-iv]').forEach(b => b.onclick = () => { S.img.view = b.dataset.iv; renderImageTab(); });

  document.querySelectorAll('#imgOut [data-w]').forEach(el => el.addEventListener('click', e => {

/* Summary grid: refs down the side, dial colours across, ✓ / ✗ image counts in each cell */
const DIAL_HEX = { black:'#141414', blue:'#1f4fa3', navy:'#1b2b5a', white:'#efefea', silver:'#c4c8cc', grey:'#6b7177', gray:'#6b7177', slate:'#4c5560', green:'#1f6b3a', champagne:'#d8c08a', gold:'#c9a23a', yellow:'#e3c53b', brown:'#5a3a22', chocolate:'#4a2c1a', pink:'#c98f7e', salmon:'#e09a7e', red:'#b3261e', orange:'#e0782c', purple:'#5b3a8c', cream:'#efe6cf', ivory:'#f1ead8', bronze:'#8c6239', copper:'#b06a3b', turquoise:'#2fb3a8', teal:'#1f7a73' };
function dialSwatch(d){
  const k = Object.keys(DIAL_HEX).find(n => lc(d).includes(n));
  return k ? `background:${DIAL_HEX[k]}` : (/pearl|mop/i.test(d) ? 'background:linear-gradient(135deg,#f4f0ff,#d9eef0,#f6e7f1)' : 'background:repeating-linear-gradient(45deg,#777 0 3px,#444 3px 6px)');
}
// every dial variant of a ref in the system → does at least one watch of it have a photo?
function refVariants(x){
  const ref = colFor('ref'), dial = colFor('dial');
  const refVal = x.rows[0] && x.rows[0][ref];
  const pool = ref && norm(refVal) ? imgPool().filter(r => norm(r[ref]) === norm(refVal)) : x.rows;
  const m = new Map();
  pool.forEach(r => { const d = txt(r[dial]) || 'no dial colour'; if (!m.has(d)) m.set(d, []); m.get(d).push(r); });
  return [...m.entries()].map(([d, rows]) => ({ dial:d, rows, ok: rows.some(hasImg) }));
}
function notFoundWhere(){
  if (DEMO) return 'in warehouse or retrieved';
  if (S.img.fetching) return '<span class="part">— checking Metabase…</span>';
  if (S.img.lookup === 'on' || S.sources.all) return 'in any Metabase question (all items, warehouse or retrieved)';
  return `in warehouse or retrieved <span class="part">— ${esc(S.img.lookupWhy || 'All items question (31879) not loaded')}</span>`;
}
function imageSummary(res){
  const brand = colFor('brand'), model = colFor('model'), ref = colFor('ref');
  const seenRef = new Set();
  res = res.filter(x => {
    if (!x.rows.length) return true;
    const k = norm(x.rows[0][ref]) || norm(x.id);
    if (seenRef.has(k)) return false;
    seenRef.add(k); return true;
  });
  const found = res.filter(x => x.rows.length).map(x => ({ x, v: refVariants(x) }));
  const freq = new Map();
  found.forEach(f => f.v.forEach(v => freq.set(v.dial, (freq.get(v.dial) || 0) + 1)));
  const dials = [...freq.keys()].sort((a, b) => freq.get(b) - freq.get(a) || a.localeCompare(b));
  S.imgCells = [];
  const head = `<tr><th class="l">Ref</th><th class="l">Brand</th><th class="l">Model</th>${dials.map(d => `<th><i class="swd" style="${dialSwatch(d)}"></i>${esc(d)}</th>`).join('')}<th class="tot">Variants</th><th class="tot">✓ Image</th><th class="tot">✗ Need</th></tr>`;
  const body = res.map(x => {
    if (!x.rows.length) return `<tr class="nf"><td class="l"><b>${esc(x.id)}</b></td><td class="l" colspan="${dials.length + 5}"><span class="r" style="font-weight:800">✗ Not found</span> ${notFoundWhere()}</td></tr>`;
    const first = x.rows[0];
    const v = found.find(f => f.x === x).v;
    const yes = v.filter(z => z.ok).length, no = v.length - yes;
    const refName = first[ref] ?? x.id;
    const label = esc(refName);
    const sub = x.type !== 'Ref' ? `<small class="acref">from ${x.type} ${esc(x.id)}</small>` : (x.how && x.how !== 'exact') ? `<small class="acref" style="color:var(--amber)">you pasted ${esc(x.id)} · close match</small>` : '';
    const cells = dials.map(d => {
      const z = v.find(q => q.dial === d);
      if (!z) return '<td class="e">—</td>';
      const idx = S.imgCells.push({ rows: z.rows, title: `Ref ${refName} · ${d} dial` }) - 1;
      return `<td><button type="button" class="cell2 ${z.ok ? '' : 'miss'}" data-cell="${idx}" title="${z.rows.length} watch${z.rows.length === 1 ? '' : 'es'} with this dial — click to view">${z.ok ? '<span class="g">✓ YES</span>' : '<span class="r">✗ NO</span>'}</button></td>`;
    }).join('');
    return `<tr><td class="l"><b>${label}</b>${sub}</td><td class="l wt">${esc(first[brand] ?? '')}</td><td class="l wt">${esc(first[model] ?? '')}</td>${cells}<td class="tot big">${v.length}</td><td class="tot big g">${yes}</td><td class="tot big ${no ? 'r' : 'z'}">${no}</td></tr>`;
  }).join('');
  return `<div class="scroll sumgrid"><table>${head}${body}</table></div><div class="fillnote">Every dial variant of each ref in the system. ✓ YES = at least one watch of that ref and dial has a photo (one is enough) · ✗ NO = still needs a photo. Click a cell to see the watches.</div>`;
}

function imageList(res){

  const body = res.map((x, i) => {
    if (!x.rows.length) return S.img.missingOnly ? '' : `<tr class="nf"><td><b>${esc(x.id)}</b></td><td colspan="8"><span class="no">✗ Not found</span> in warehouse or retrieved</td></tr>`;

function imageFull(res){
  const ref = colFor('ref'), brand = colFor('brand'), model = colFor('model'), dial = colFor('dial');
  S.imgCards = [];
  return res.map(x => {
    if (!x.rows.length) return `<div class="refrow"><div class="refhead"><b>${esc(x.id)}</b><span class="no">✗ Not found</span></div></div>`;

    const cards = [...groups.entries()].map(([d, list]) => {

        ${cardHTML(r, idx).replace('<span class="none">No photo</span>', '<span class="no big">✗ NO IMAGE</span>')}

}

function exportImageCsv(res){
  const cols = ['LOOKED_UP','FOUND_AS','IMAGE', ...S.cols];
  const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [cols.join(',')];
  res.forEach(x => x.rows.length ? x.rows.forEach(r => lines.push([x.id, x.type, hasImg(r) ? 'YES' : covered(r) ? 'MATCH' : 'NO', ...S.cols.map(c => r[c])].map(cell).join(','))) : lines.push([x.id, 'NOT FOUND', ''].map(cell).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
  a.download = `watch-images-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function addVendorName(v){

async function loadAll(){
  const src = $('src'); src.className = 'src'; src.innerHTML = '<i></i>Watches: <b>Loading</b> from Metabase…';
  const t0 = performance.now();
  $('out').innerHTML = '<div class="msg loading">Loading every watch</div>';
  S.cols = []; S.all = []; S.sources = {}; S.noWarehouseQ = false;
  const [res] = await Promise.all([Promise.allSettled(SOURCES.map(s => api({}, s))), loadFills()]);
  const notes = [];
  SOURCES.forEach((s, i) => {
    const r = res[i];
    if (r.status === 'fulfilled'){
      const j = r.value;
      const rows = toObjects(j, s);
      S.sources[s] = { card:j.card, name:j.name, filters:new Set(j.filters || []), count:rows.length, via:j.via, note:j.note };
      if (j.note && rows.length >= 1000 && rows.length % 1000 === 0) notes.push(`${SOURCE_NAME[s]} (question ${j.card}): ${j.note}.`);
      S.all.push(...rows);
      if (j.truncated) notes.push(`${SOURCE_NAME[s]} returned exactly 2,000 rows, so totals may be cut off. Check question ${j.card} for a LIMIT.`);
    } else if (s === 'warehouse' && /not set yet/.test(r.reason.message)){ S.noWarehouseQ = true; notes.push('Warehouse question not set yet — the Warehouse tab shows on-hand watches from All for now.'); }
    else notes.push(`${SOURCE_NAME[s]} didn't load: ${r.reason.message}`);
  });
  if (S.fillsOff) notes.push(`Vendor and Sold Price can't be saved yet: ${S.fillsOff}`);
  $('note').textContent = notes.join(' ');
  if (!S.all.length && !Object.keys(S.sources).length){
    src.className = 'src bad'; src.innerHTML = '<i></i>Metabase not reachable';
    $('out').innerHTML = `<div class="msg err">Couldn't load watches. ${esc(notes.join(' '))}</div>`;
    return;
  }
  S.loaded = true;
  S.imgCol = S.cols.find(c => IMG_COL_RE.test(c) && S.all.some(r => /^(https?:|data:image)/.test(String(r[c] || ''))));
  S.urlCol = S.cols.find(c => /ITEM_URL|ADMIN_URL/.test(c)) || null;
  unifyRows(S.all);
  setupVisible();
  applyUserCols();
  drawCols();
  src.className = 'src ok';
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  src.innerHTML = '<i></i>Watches: ' + (DEMO ? '<span class="demo">Demo data</span>' : '<b>Live</b>')
    + ` · Metabase ${Object.values(S.sources).map(v => `<span title="${esc(v.name)}">${esc(v.card)}</span>`).join(' + ')} · `
    + Object.entries(S.sources).map(([s,v]) => `<b>${v.count.toLocaleString()}</b> ${s === 'warehouse' ? 'in warehouse' : s === 'retrieved' ? 'retrieved' : 'all items'}`).join(' · ')
    + `<span id="matchInfo"></span> · pulled ${new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' })} (${secs}s)`;
  migrateUsers();
  if (DEMO && meUser() && meUser().active === false){ signOut('Your access was turned off by an admin'); return; }
  drawUserChip();
  if (!S.source) S.source = 'warehouse';
  drawSource();
  run($('q').value);
}

// which loaded rows make up each tab
function tabSources(tab){
  if (tab === 'all') return S.sources.all ? ['all'] : ['warehouse', 'retrieved'];
  if (tab === 'warehouse' && !S.sources.warehouse) return ['all'];
  return [tab];
}
function tabRows(tab){
  const srcs = tabSources(tab);
  let rows = S.all.filter(r => srcs.includes(r.SOURCE));
  if (tab === 'warehouse' && !S.sources.warehouse){ const st = colFor('status'), out = new Set(OUT_STATUSES.concat(['retrieved'])); rows = rows.filter(r => !out.has(lc(r[st]))); }
  return rows;
}
function drawSource(){
  $('srcSeg').querySelectorAll('[data-src]').forEach(b => { const on = b.dataset.src === S.source; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  const cnt = { warehouse: S.sources.warehouse ? S.sources.warehouse.count : (S.loaded ? tabRows('warehouse').length : null), retrieved: S.sources.retrieved?.count };
  cnt.all = S.sources.all ? S.sources.all.count : (cnt.warehouse || 0) + (cnt.retrieved || 0);
  $('srcSeg').querySelectorAll('[data-count]').forEach(el => { const n = cnt[el.dataset.count]; el.textContent = n == null ? '' : n.toLocaleString(); });
  $('searchUI').hidden = S.source === 'image';
  const lab = $('onhandLab'); lab.style.opacity = S.source === 'warehouse' ? 1 : .4;
  lab.title = S.source === 'warehouse' ? '' : 'Applies to the Warehouse tab only';
}

function serverParams(p, source){
  const params = {};
  for (const f of p.filters){
    if (f.kind !== 'field' || f.neg || !SERVER_TAG[f.key] || !f.vals || f.vals.length !== 1) continue;
    if (f.key === 'model' && f.op !== 'has') continue;
    if (f.key !== 'model' && f.op !== 'eq') continue;
    if (!S.sources[source] || !S.sources[source].filters.has(SERVER_TAG[f.key])) continue;
    params[SERVER_TAG[f.key]] = f.vals[0];
  }
  return params;
}

let runId = 0;
async function run(raw){
  if (!S.loaded) return;
  if (S.source === 'image'){ renderImageTab(); return; }
  const id = ++runId;
  const p = parse(raw);
  S.parsed = p;
  if (p.group) S.groupCol = p.group;
  if (p.sort){ S.sortCol = p.sort.col; S.sortDir = p.sort.dir; }
  drawChips(p);
  const q = String(raw || '').trim();
  history.replaceState(null, '', q ? '?q=' + encodeURIComponent(q) : location.pathname);
  if (q) remember(q);

  const active = tabSources(S.source);
  let base = tabRows(S.source);
  const jobs = active.map(s => [s, serverParams(p, s)]).filter(([, prm]) => Object.keys(prm).length);
  if (jobs.length){
    $('out').insertAdjacentHTML('afterbegin', '<div class="msg loading" id="narrow">Checking Metabase</div>');
    const seen = new Set(base.map(keyOf));
    const res = await Promise.allSettled(jobs.map(([s, prm]) => api(prm, s).then(j => toObjects(j, s))));
    if (id !== runId) return;
    res.forEach((r, i) => {
      if (r.status === 'fulfilled'){ unifyRows(r.value); r.value.forEach(o => { if (!seen.has(keyOf(o))){ seen.add(keyOf(o)); base.push(o); } }); }
      else $('note').textContent = `${SOURCE_NAME[jobs[i][0]]} filter failed (${r.reason.message}); searched the loaded watches instead.`;
    });
  }
  S.rows = base;
  S.pages = 1;
  apply();
}
function keyOf(r){ const ac = colFor('ac'); return r.SOURCE + ':' + (ac && r[ac] != null ? String(r[ac]) : r._s); }

function apply(){
  const p = S.parsed || parse('');
  const statusCol = colFor('status');
  const hasStatus = p.filters.some(f => f.col === statusCol);
  const onhand = $('onhand').checked && statusCol && !hasStatus;
  const out = new Set(OUT_STATUSES);
  S.filtered = S.rows.filter(r => (!onhand || S.source !== 'warehouse' || !out.has(lc(r[statusCol]))) && p.filters.every(f => test(r, f)));
  render();
}

/* ============================== render ============================== */
function setupVisible(){
  const saved = store.get('wc_visible', null);
  if (saved && saved.some(c => S.cols.includes(c))) { S.visible = saved.filter(c => S.cols.includes(c)); return; }
  const map = { IMAGE:S.imgCol, AC:colFor('ac'), BRAND:colFor('brand'), MODEL:colFor('model'), REF:colFor('ref'), DIAL:colFor('dial'), STATUS:colFor('status'), EV:colFor('ev'), COST:colFor('cost'), PO:colFor('po') };
  S.visible = DEFAULT_VISIBLE.map(k => map[k]).filter(Boolean);
  if (S.visible.length < 4) S.visible = S.cols.slice(0, 10);
  S.groupCol = S.groupCol || colFor('brand') || S.cols[0];
}

function drawCols(){
  const counts = {};
  S.cols.forEach(c => counts[c] = S.all.filter(r => r[c] != null && r[c] !== '').length);
  $('colList').innerHTML = S.cols.filter(c => counts[c]).map(c => `<button type="button" data-col="${esc(c)}" title="Insert ${esc(c.toLowerCase())}:">${esc(c.toLowerCase())}<small>${counts[c].toLocaleString()}</small></button>`).join('');
  $('colList').querySelectorAll('[data-col]').forEach(b => b.addEventListener('click', () => {
    const q = $('q'); q.value = (q.value.trim() + ' ' + b.dataset.col.toLowerCase() + ':').trimStart(); q.focus();
  }));
}

function drawChips(p){
  const chips = p.filters.map((f,i) => `<span class="chip ${f.neg ? 'neg' : ''}">${describe(f)}<button type="button" data-rmf="${i}" aria-label="Remove">×</button></span>`);
  if (p.group) chips.push(`<span class="chip"><em>totals by</em> ${esc(pretty(p.group))}<button type="button" data-rmt="${esc(p.groupRaw)}" aria-label="Remove">×</button></span>`);
  if (p.sort) chips.push(`<span class="chip"><em>sorted by</em> ${esc(pretty(p.sort.col))}<button type="button" data-rmt="${esc(p.sortRaw)}" aria-label="Remove">×</button></span>`);
  p.warnings.forEach(w => chips.push(`<span class="chip warn">${esc(w)}</span>`));
  $('chips').innerHTML = chips.join('');
  const rebuild = drop => {
    const left = [...p.tokens];
    drop.forEach(t => { const i = left.indexOf(t); if (i > -1) left.splice(i, 1); });
    $('q').value = left.map(t => t.replace(/^(-?)(\w+)__part:(.+)$/, (m, n, part, v) => `${n}${v.replace(/\|/g, ' ')} ${part}`)).join(' ').replace(/^(or\s+)+|(\s+or)+$/gi, '').replace(/\bor(\s+or)+\b/gi, 'or').trim();
    run($('q').value);
  };
  $('chips').querySelectorAll('[data-rmf]').forEach(b => b.addEventListener('click', () => rebuild(p.filters[+b.dataset.rmf].raws)));
  $('chips').querySelectorAll('[data-rmt]').forEach(b => b.addEventListener('click', () => rebuild([b.dataset.rmt])));
}

  const evT = sum(ev), costT = sum(cost);
  const evN = ev ? rows.filter(r => num(r[ev])).length : 0;
  const distinct = c => c ? new Set(rows.map(r => lc(r[c])).filter(Boolean)).size : null;

  if (!rows.length){

    return;

  ${brows.length > shownN ? `<div class="more"><button class="btn" id="more">Show ${Math.min(PAGE[view], brows.length - shownN).toLocaleString()} more · ${(brows.length - shownN).toLocaleString()} left</button></div>` : ''}

/* searchable column picker */
const colLabel = c => c === '__ALL' ? 'all columns' : pretty(c || '');
function comboHTML(id, current, label){
  return `<div class="combo" id="${id}"><span class="combo-lab">${esc(label)}</span><input type="text" value="${esc(colLabel(current))}" data-cur="${esc(current || '')}" placeholder="Search columns" aria-label="${esc(label)}: search columns" autocomplete="off" spellcheck="false"><div class="combo-list" role="listbox" hidden></div></div>`;
}
function bindCombo(id, onPick, extra = []){
  const box = $(id); if (!box) return;
  const input = box.querySelector('input'), list = box.querySelector('.combo-list');
  let hits = [], idx = 0;
  const draw = () => {
    const q = norm(input.value);
    const filled = c => S.all.some(r => r[c] != null && r[c] !== '');
    hits = extra.concat(S.cols).filter(c => !q || norm(c).includes(q) || norm(colLabel(c)).includes(q))
      .sort((a, b) => (norm(a).startsWith(q) ? 0 : 1) - (norm(b).startsWith(q) ? 0 : 1) || (filled(a) ? 0 : 1) - (filled(b) ? 0 : 1));
    idx = 0;
    list.innerHTML = hits.length
      ? hits.map((c, i) => `<div role="option" class="${i === idx ? 'on' : ''} ${c === input.dataset.cur ? 'cur' : ''}" data-c="${esc(c)}">${esc(colLabel(c))}</div>`).join('')
      : '<div class="none">No column matches</div>';
    list.hidden = false;
  };
  const hl = () => list.querySelectorAll('[data-c]').forEach((el, i) => { el.classList.toggle('on', i === idx); if (i === idx) el.scrollIntoView({ block:'nearest' }); });
  const pick = c => { list.hidden = true; if (c && c !== input.dataset.cur) onPick(c); else input.value = colLabel(input.dataset.cur); };
  input.addEventListener('focus', () => { input.select(); input.value = ''; draw(); });
  input.addEventListener('input', draw);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); idx = Math.min(idx + 1, hits.length - 1); hl(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); idx = Math.max(idx - 1, 0); hl(); }
    else if (e.key === 'Enter'){ e.preventDefault(); pick(hits[idx]); }
    else if (e.key === 'Escape'){ list.hidden = true; input.value = colLabel(input.dataset.cur); input.blur(); }
  });
  list.addEventListener('mousedown', e => { const el = e.target.closest('[data-c]'); if (el){ e.preventDefault(); pick(el.dataset.c); } });
  input.addEventListener('blur', () => setTimeout(() => { if (!list.hidden){ list.hidden = true; input.value = colLabel(input.dataset.cur); } }, 120));
}

const profitHTML = n => `<span style="color:${n < 0 ? 'var(--red)' : 'var(--green)'}">${n < 0 ? '−' : ''}${money(Math.abs(n))}</span>`;

function bindFills(){
  const inputs = [...document.querySelectorAll('input.cell')];
  inputs.forEach(inp => {
    const tr = inp.closest('tr');
    inp.dataset.saved = inp.value;
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('focus', () => { if (inp.dataset.fill === 'sold_price' && inp.value) inp.value = String(num(inp.value)); inp.select(); });
    const commit = async () => {
      const field = inp.dataset.fill;
      let value = inp.value.trim();
      if (field === 'sold_price'){
        const n = value === '' ? null : parseNum(value);
        if (value !== '' && n == null){ inp.classList.add('bad'); toast('Sold price must be a number'); return; }
        value = n;
        inp.value = n == null ? '' : money(n);
      }
      const shown = inp.value;
      if (shown === inp.dataset.saved){ inp.classList.remove('bad'); return; }
      if (!S.me){ inp.value = inp.dataset.saved; showLogin('Please sign in'); return; }
      if (meUser() && meUser().active === false){ inp.value = inp.dataset.saved; toast('Your access is turned off — ask an admin'); return; }
      inp.classList.remove('bad'); inp.classList.add('saving');
      try {
        await saveFill(S.source, S.groupCol, tr.dataset.group, field, value === '' ? null : value);
        inp.dataset.saved = shown;
        inp.classList.remove('saving'); inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 900);
        refreshFillTotals();
      } catch(e){
        inp.classList.remove('saving'); inp.classList.add('bad'); toast(e.message);
      }
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        e.preventDefault();
        const same = inputs.filter(x => x.dataset.fill === inp.dataset.fill);
        const next = same[same.indexOf(inp) + 1];
        next ? next.focus() : inp.blur();
      } else if (e.key === 'Escape'){ inp.value = inp.dataset.saved; inp.blur(); }
    });
  });
}
function refreshFillTotals(){
  let sold = 0, cost = 0, n = 0;
  document.querySelectorAll('tr[data-group]').forEach(tr => {
    const f = S.fills.get(fillKey(S.source, S.groupCol, tr.dataset.group)) || {};
    const c = Number(tr.dataset.cost) || 0, s = f.sold == null ? null : Number(f.sold);
    const pf = tr.querySelector('.pf'), sr = tr.querySelector('.sr');
    if (pf) pf.innerHTML = s == null ? '—' : profitHTML(s - c);
    if (sr) sr.textContent = s == null || !c ? '—' : (s / c).toFixed(2) + '×';
    if (s != null){ sold += s; cost += c; n++; }
  });
  if ($('tSold')) $('tSold').textContent = n ? money(sold) : '—';
  if ($('tProfit')) $('tProfit').innerHTML = n ? profitHTML(sold - cost) : '—';
  if ($('rSold')){ $('rSold').textContent = money(sold); $('rSoldWrap').hidden = !n; }
  const vendors = S.vendors;
  if ($('vendorList')) $('vendorList').innerHTML = vendors.map(v => `<option value="${esc(v)}">`).join('');
}

// Add only logos you have the rights to use. Brands without one get a monogram badge.
