function groupBadge(col, val){
  if (val === '(blank)') return '<span class="gbadge"></span>';
  if (col === colFor('brand')){
    const logo = BRAND_LOGOS[lc(val)];
    if (logo) return `<span class="gbadge logo"><img src="${esc(logo)}" alt="${esc(val)} logo"></span>`;
    const duo = BRAND_LOGO_DUO[lc(val)];
    if (duo) return `<span class="gbadge logo" title="${esc(val)}"><span class="lduo"><i class="lmask" style="--m:url('${duo.mask}')"></i><img src="${duo.color}" alt="${esc(val)} logo"></span></span>`;
    const mask = BRAND_LOGO_MASKS[lc(val)] || BRAND_LOGO_MASKS[lc(val).split(' ')[0]];
    if (mask) return `<span class="gbadge logo" title="${esc(val)}"><i class="lmask${WIDE_LOGOS.has(lc(val)) ? ' wide' : ''}" style="--m:url('${mask}')"></i></span>`;
    const ini = String(val).split(/[\s&-]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return `<span class="gbadge mono" title="${esc(val)}">${esc(ini)}</span>`;
  }
  if (col === colFor('dial')) return `<span class="gbadge"><i class="swd" style="${dialSwatch(val)};margin:0;width:22px;height:22px"></i></span>`;
  return '';
}

function addToPrompt(tok){
  const q = $('q');
  const t = /\s/.test(tok.split('=').slice(1).join('=')) ? tok.replace(/=(.*)$/, '="$1"') : tok;
  q.value = (q.value.trim() + ' ' + t).trim();
  run(q.value);
}

function bind(page){
  const out = $('out');
  out.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addToPrompt(b.dataset.add)));
  out.querySelectorAll('[data-sec]').forEach(b => b.addEventListener('click', () => { S.section = b.dataset.sec; store.set('wc_section', S.section); render(); }));
  bindCombo('groupSel', c => { S.groupCol = c; render(); });
  bindFills();
  drawUserChip();
  $('userChip')?.addEventListener('click', openUsers);
  out.querySelectorAll('[data-group]').forEach(tr => tr.addEventListener('click', () => {
    const k = tr.dataset.group; const gc = S.groupCol;
    const short = Object.keys(ALIASES).find(a => resolveAlias(a) === gc) || gc.toLowerCase();
    if (k === '(blank)') return toast('Blank values can’t be filtered from the prompt');
    const val = isMoneyCol(gc) ? String(num(k.replace(/[$,]/g,''))) : k;
    addToPrompt(`${short}=${val}`);
  }));
  out.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.sort;
    if (S.sortCol === c || (!S.sortCol && c === colFor('ev'))) S.sortDir *= -1; else { S.sortCol = c; S.sortDir = isMoneyCol(c) ? -1 : 1; }
    S.sortCol = c; render();
  }));
  $('colBtn')?.addEventListener('click', openColumns);
  out.querySelectorAll('[data-vis]').forEach(cb => cb.addEventListener('change', () => {
    const c = cb.dataset.vis;
    S.visible = cb.checked ? S.cols.filter(x => S.visible.includes(x) || x === c) : S.visible.filter(x => x !== c);
    store.set('wc_visible', S.visible);
    render(); out.querySelector('details.picker')?.setAttribute('open','');
  }));
  $('more')?.addEventListener('click', () => { S.pages++; render(); });
  out.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { S.view = b.dataset.view; store.set('wc_view', S.view); S.pages = 1; render(); }));
  bindCombo('sortSel', c => { S.sortCol = c; S.sortDir = isMoneyCol(c) ? -1 : 1; render(); });
  bindCombo('rqCol', c => { S.rq.col = c; S.pages = 1; render(); $('rqText')?.focus(); }, ['__ALL']);
  const rqIn = $('rqText');
  if (rqIn){
    rqIn.addEventListener('input', () => {
      clearTimeout(S.rqT);
      S.rqT = setTimeout(() => {
        S.rq.text = rqIn.value; S.pages = 1;
        const pos = rqIn.selectionStart; render();
        const again = $('rqText'); if (again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch {} }
      }, 180);
    });
    rqIn.addEventListener('keydown', e => { if (e.key === 'Escape' && rqIn.value){ e.stopPropagation(); rqIn.value = ''; rqIn.dispatchEvent(new Event('input')); } });
  }
  [['rqMin','min'], ['rqMax','max']].forEach(([id, key]) => {
    const el = $(id); if (!el) return;
    el.addEventListener('input', () => {
      clearTimeout(S.rqT);
      S.rqT = setTimeout(() => {
        const v = el.value.trim();
        if (v !== '' && parseNum(v) == null){ el.classList.add('bad'); return; }
        el.classList.remove('bad');
        S.rq[key] = v; S.pages = 1;
        const pos = el.selectionStart; render();
        const again = $(id); if (again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch {} }
      }, 300);
    });
    el.addEventListener('keydown', e => { if (e.key === 'Escape' && el.value){ e.stopPropagation(); el.value = ''; el.dispatchEvent(new Event('input')); } });
  });
  $('rqEvClr')?.addEventListener('click', () => { S.rq.min = ''; S.rq.max = ''; S.pages = 1; render(); });
  $('dirBtn')?.addEventListener('click', () => { S.sortCol = S.sortCol || colFor('ev'); S.sortDir *= -1; render(); });
  out.querySelectorAll('[data-info]').forEach(b => b.addEventListener('click', () => openDetail(page[+b.dataset.info], page)));
  out.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const k = keyOf(page[+b.dataset.pick]);
    S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k);
    b.closest('.wcard').classList.toggle('sel', S.sel.has(k));
    b.setAttribute('aria-pressed', S.sel.has(k));
    refreshSel();
  }));
  out.querySelectorAll('[data-cp]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); copy(b.dataset.cp); }));
  bindSel();
  $('csv')?.addEventListener('click', exportCsv);
  out.querySelectorAll('tr[data-i]').forEach(tr => tr.addEventListener('click', () => openDetail(page[+tr.dataset.i], page)));
}

const CP_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>';
async function copy(t){ try { await navigator.clipboard.writeText(String(t)); toast('Copied ' + t); } catch { toast('Copy failed'); } }
function val(r, short){ const c = colFor(short); const v = c ? r[c] : null; return v == null || v === '' ? null : v; }
const cpBtn = v => v == null ? '' : `<button type="button" class="cp" data-cp="${esc(v)}" aria-label="Copy ${esc(v)}">${CP_ICON}</button>`;
const txt = v => v == null ? null : (typeof v === 'boolean' ? (v ? 'yes' : 'no') : String(v).replace(/_/g,' '));

function dimsText(r){
  const d = k => { const c = colFor(k); return c && r[c] != null && r[c] !== '' ? display(c, r[c]) : null; };
  const w = d('width'), l = d('length'), ht = d('height'), wt = d('weight');
  const parts = [w && 'W ' + w, l && 'L ' + l, ht && 'H ' + ht, wt].filter(Boolean);
  return parts.join(' · ');
}
function cardHTML(r, i){
  const brand = val(r,'brand'), model = val(r,'model'), ref = val(r,'ref'), ac = val(r,'ac');
  const ev = num(val(r,'ev')), cost = num(val(r,'cost')), status = lc(val(r,'status'));
  let size = val(r,'size'); if (size != null && /^\d+(\.\d+)?$/.test(String(size))) size = size + 'mm';
  const spec = [
    ['Dial', txt(val(r,'dial'))],
    ['Movement', txt(val(r,'movement'))],
    ['Case', [size, txt(val(r,'case'))].filter(Boolean).join(' · ')],
    ['Bracelet', [txt(val(r,'bracelet')), txt(val(r,'braceletcolor'))].filter(Boolean).join(' · ')],
    ['Gender', txt(val(r,'gender'))],
    ['Condition', txt(val(r,'condition'))],
    ['Box', txt(val(r,'box'))],
    ['Papers', txt(val(r,'papers'))],
    ['Size', dimsText(r)]
  ].map(([k, x]) => [k, x || '']);
  const po = val(r,'po'), order = val(r,'order'), tag = val(r,'tag');
  const img = S.imgCol ? r[S.imgCol] : null;
  const picked = S.sel.has(keyOf(r));
  const out = OUT_STATUSES.includes(status);
  return `<article class="wcard ${picked ? 'sel' : ''}">
    <div class="whead">
      <button type="button" class="ibtn" data-info="${i}" aria-label="All details">i</button>
      ${esc(brand || 'Watch')}<br>${ref ? 'Ref ' + esc(ref) : ''}
      <button type="button" class="cbtn" data-pick="${i}" aria-pressed="${picked}" aria-label="Select watch">✓</button>
    </div>
    <div class="wimg">${img ? `<img loading="lazy" src="${esc(img)}" alt="${esc([brand, model].filter(Boolean).join(' '))}" onerror="this.outerHTML='<span class=&quot;none&quot;>No photo</span>'">` : '<span class="none">No photo</span>'}</div>
    <div class="wbody">
      <div class="wbrand">${esc(brand || '')}</div>
      <div class="wmodel">${esc(model || ref || '')}</div>
      <div class="wkv">${spec.map(([k,v]) => `<span>${k}</span><span>${esc(v)}</span>`).join('')}</div>
      <div class="wac"><span>${ac ? `<span style="color:var(--muted)">AC</span> <b>${esc(ac)}</b>${cpBtn(ac)}` : ''}</span><span class="ev">${ev != null ? money(ev) : '—'}</span></div>
      <div class="wkv low">
        <span>Ref</span><span>${ref ? esc(ref) + cpBtn(ref) : ''}</span>
        <span>Tag</span><span>${tag ? esc(tag) : ''}</span>
        <span>PO</span><span>${po ? esc(po) + cpBtn(po) : ''}</span>
        <span>Order</span><span>${order ? esc(order) + cpBtn(order) : ''}</span>
        <span>Cost</span><span>${cost != null ? money(cost) : ''}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${S.source === 'all' ? `<span class="st wst ${r.SOURCE === 'retrieved' ? 'out' : ''}">${r.SOURCE}</span>` : ''}${status ? `<span class="st wst ${out ? 'out' : ''}">${esc(status.replace(/_/g,' '))}</span>` : ''}</div>
    </div>
  </article>`;
}

function selBar(rows){
  const picked = rows.filter(r => S.sel.has(keyOf(r)));
  if (!picked.length) return '<span class="sel" id="selInfo" hidden></span>';
  const ev = picked.reduce((s,r) => s + (num(val(r,'ev')) || 0), 0);
  const cost = picked.reduce((s,r) => s + (num(val(r,'cost')) || 0), 0);
  return `<span class="sel" id="selInfo">Selected <b>${picked.length}</b> · EV <b>${money(ev)}</b>${colFor('cost') ? ` · cost <b>${money(cost)}</b>` : ''}
    <button class="btn sm" data-selact="copy">Copy ACs</button><button class="btn sm" data-selact="clear">Clear</button></span>`;
}
function refreshSel(){
  const el = $('selInfo'); if (!el) return;
  el.outerHTML = selBar(S.filtered);
  bindSel();
}
function bindSel(){
  document.querySelectorAll('[data-selact]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.selact === 'clear'){ S.sel.clear(); render(); return; }
    const acs = S.filtered.filter(r => S.sel.has(keyOf(r))).map(r => val(r,'ac')).filter(Boolean);
    copy(acs.join('\n'));
  }));
}

S.detail = null;
function openDetail(r, list, opts = {}){
  list = (list && list.length ? list : [r]);
  S.detail = { list, i: Math.max(0, list.indexOf(r)), changed:false, title: opts.title || '', strip: !!opts.strip };
  drawDetail();
  $('modal').classList.remove('cmodal', 'umodal');
  $('modal').classList.add('open', 'dmodal');
  setTimeout(() => $('dNext')?.focus(), 30);
}
function drawDetail(){
  const D = S.detail; if (!D) return;
  const r = D.list[D.i];
  const C = k => colFor(k);
  const v = k => { const c = C(k); return c && r[c] != null && r[c] !== '' ? r[c] : null; };
  const brand = v('brand'), model = v('model'), ref = v('ref'), ac = v('ac');
  let size = v('size'); if (size != null && /^\d+(\.\d+)?$/.test(String(size))) size = size + 'mm';
  const picked = S.sel.has(keyOf(r));
  const selN = S.sel.size;
  const sub = [ref ? 'Ref ' + ref : null, v('dial') ? txt(v('dial')) + ' dial' : null, txt(v('movement')), size, txt(v('case'))].filter(Boolean).join(' · ');
  const copyVal = x => x == null ? '—' : `<b>${esc(x)}</b>${cpBtn(x)}`;
  const status = txt(v('status'));
  const fields = [
    ['Estimated value', v('ev') != null ? `<b>${money(num(v('ev')))}</b>` : null],
    ['Purchase cost', v('cost') != null ? `<b>${money(num(v('cost')))}</b>` : null],
    ['Status', status ? `<span class="st ${OUT_STATUSES.includes(lc(v('status'))) ? 'out' : ''}">${esc(status)}</span> <span style="color:var(--faint)">${r.SOURCE || ''}</span>` : null],
    ['Reference', ref ? copyVal(ref) : null],
    ['Dial', esc(txt(v('dial')) || '')],
    ['Movement', esc(txt(v('movement')) || '')],
    ['Case', esc([txt(v('case')), size].filter(Boolean).join(' · '))],
    ['Bracelet', esc([txt(v('bracelet')), txt(v('braceletcolor'))].filter(Boolean).join(' · '))],
    ['Gender', esc(txt(v('gender')) || '')],
    ['Condition', esc(txt(v('condition')) || '')],
    ['Box', esc(txt(v('box')) || '')],
    ['Papers', esc(txt(v('papers')) || '')],
    ['Tag', v('tag') ? `<span class="dtag">${esc(v('tag'))}</span>` : null],
    ['Bin', v('bin') ? esc(v('bin')) : null],
    ['AC number', ac ? copyVal(ac) : null],
    ['PO', v('po') ? copyVal(v('po')) : null],
    ['Order', v('order') ? copyVal(v('order')) : null],
    ['Weight', v('weight') != null ? esc(display(colFor('weight'), v('weight'))) : null],
    ['Height', v('height') != null ? esc(display(colFor('height'), v('height'))) : null],
    ['Width', v('width') != null ? esc(display(colFor('width'), v('width'))) : null],
    ['Length', v('length') != null ? esc(display(colFor('length'), v('length'))) : null]
  ].map(([k, x]) => [k, x || '']);
  // any other filled column goes under "All fields"
  const used = new Set(['ev','cost','status','ref','dial','movement','case','size','bracelet','braceletcolor','gender','condition','box','papers','tag','bin','ac','po','order','brand','model','weight','height','width','length'].map(C).filter(Boolean).concat([S.imgCol, S.urlCol, 'SOURCE']));
  const idCol = S.cols.find(c => /^(ITEM_)?ID$|_UUID$|^UUID$/.test(c));
  if (idCol && r[idCol] != null) { fields.push(['Item ID', `<span class="mono2">${esc(r[idCol])}</span>`]); used.add(idCol); }
  const extra = S.cols.filter(c => !used.has(c) && r[c] != null && r[c] !== '');
  const img = S.imgCol && r[S.imgCol] ? r[S.imgCol] : null;

  $('sheet').innerHTML = `
    <div class="dnav">
      <button class="btn" id="dPrev" ${D.i === 0 ? 'disabled' : ''}>‹ Prev</button>
      <div class="dpos">${D.title ? `<div class="dtitle">${esc(D.title)}</div>` : ''}Watch <b>${D.i + 1}</b> of <b>${D.list.length}</b>${D.strip ? ` · <span class="g">✓ ${D.list.filter(hasImg).length}</span> <span class="r">✗ ${D.list.filter(w => !hasImg(w)).length}</span>` : ''}${selN ? ` · <span class="g">${selN} selected</span>` : ''}</div>
      <button class="btn" id="dNext" ${D.i >= D.list.length - 1 ? 'disabled' : ''}>Next ›</button>
    </div>
    ${D.strip && D.list.length > 1 ? `<div class="dstrip">${D.list.map((w, k) => `<button type="button" class="dth ${k === D.i ? 'on' : ''} ${hasImg(w) ? '' : 'miss'}" data-k="${k}" title="AC ${esc(w[colFor('ac')] ?? '')}">${hasImg(w) ? `<img src="${esc(w[S.imgCol])}" alt="">` : '<span>✗</span>'}<small>${esc(String(w[colFor('ac')] ?? '').slice(-4))}</small></button>`).join('')}</div>` : ''}
    <div class="dbody">
      <div class="dphoto">${img ? `<img src="${esc(img)}" alt="${esc([brand, model].filter(Boolean).join(' '))}" onerror="this.outerHTML='<span class=&quot;no big&quot;>✗ NO IMAGE</span>'">` : '<span class="no big">✗ NO IMAGE</span>'}</div>
      <div class="dinfo">
        <h3>${esc([brand, model].filter(Boolean).join(' ') || 'Watch')}</h3>
        <div class="dsub">${esc(sub)}</div>
        <div class="dkv">${fields.map(([k, x]) => `<span>${k}</span><span>${x}</span>`).join('')}</div>
        ${extra.length ? `<details class="dmore"><summary>All fields (${extra.length} more)</summary><div class="dkv">${extra.map(c => `<span>${esc(pretty(c))}</span><span>${/^https?:/.test(String(r[c])) ? `<a href="${esc(r[c])}" target="_blank" rel="noopener">${esc(r[c])}</a>` : esc(display(c, r[c]))}</span>`).join('')}</div></details>` : ''}
      </div>
    </div>
    <div class="dfoot">
      ${S.urlCol && r[S.urlCol] ? `<a class="btn dadmin" href="${esc(r[S.urlCol])}" target="_blank" rel="noopener">Open in admin ↗</a>` : ''}
      <button class="btn dsel ${picked ? 'on' : ''}" id="dSel">${picked ? '✓ Selected — click to remove' : 'Select this watch'}</button>
      <button class="btn go" id="dClose">Close</button>
    </div>
    <div class="dhint">← → move · Space select · Esc close</div>`;
  $('sheet').querySelectorAll('.dth').forEach(b => b.onclick = () => { S.detail.i = +b.dataset.k; drawDetail(); });
  $('dPrev').onclick = () => moveDetail(-1);
  $('dNext').onclick = () => moveDetail(1);
  $('dSel').onclick = toggleDetailSel;
  $('dClose').onclick = closeDetail;
  $('sheet').querySelectorAll('[data-cp]').forEach(b => b.onclick = e => { e.stopPropagation(); copy(b.dataset.cp); });
}
function moveDetail(d){
  const D = S.detail; if (!D) return;
  const n = D.i + d; if (n < 0 || n >= D.list.length) return;
  D.i = n; drawDetail();
  $(d > 0 ? 'dNext' : 'dPrev')?.focus();
}
function toggleDetailSel(){
  const D = S.detail; if (!D) return;
  const k = keyOf(D.list[D.i]);
  S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k);
  D.changed = true; drawDetail();
}
function closeDetail(){
  const changed = S.detail && S.detail.changed;
  $('modal').classList.remove('open', 'dmodal');
  S.detail = null;
  if (changed && S.source !== 'image') render();
}

function exportCsv(){
  const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [S.cols.join(',')].concat((S.brows || S.filtered).map(r => S.cols.map(c => cell(r[c])).join(',')));
  const blob = new Blob([lines.join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `watches-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Exported ${(S.brows || S.filtered).length.toLocaleString()} watches`);
}

/* ============================== recent & examples ============================== */
function remember(q){
  const r = store.get('wc_recent', []).filter(x => x.toLowerCase() !== q.toLowerCase());
  r.unshift(q); store.set('wc_recent', r.slice(0, 6)); drawEx();
}
function drawEx(){
  const recent = store.get('wc_recent', []);
  const list = recent.length ? recent : EXAMPLES;
  $('ex').innerHTML = (recent.length ? 'Recent' : 'Try') + ' ' + list.map(x => `<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('') +
    (recent.length ? ` <button type="button" data-ex="1">examples</button>` : '');
  $('ex').querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { $('q').value = b.dataset.q; run(b.dataset.q); }));
  $('ex').querySelector('[data-ex]')?.addEventListener('click', () => {
    $('ex').innerHTML = 'Try ' + EXAMPLES.map(x => `<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('');
    $('ex').querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { $('q').value = b.dataset.q; run(b.dataset.q); }));
  });
}

/* ============================== boot ============================== */
$('form').addEventListener('submit', e => { e.preventDefault(); run($('q').value); });
$('q').addEventListener('search', () => { if (!$('q').value) run(''); });
$('onhand').checked = store.get('wc_onhand', true);
$('onhand').addEventListener('change', () => { store.set('wc_onhand', $('onhand').checked); S.pages = 1; apply(); });
$('reload').addEventListener('click', loadAll);
$('hdrUsers').addEventListener('click', openUsers);
$('hdrOut').addEventListener('click', () => signOut());
$('lShow').addEventListener('click', () => { const p = $('lPass'); p.type = p.type === 'password' ? 'text' : 'password'; $('lShow').textContent = p.type === 'password' ? 'Show' : 'Hide'; });
$('lform').addEventListener('submit', async e => {
  e.preventDefault();
  $('lBtn').disabled = true; $('lErr').textContent = '';
  try { enterApp(await signIn($('lEmail').value, $('lPass').value)); }
  catch(err){ $('lErr').textContent = err.message; $('lPass').select(); }
  finally { $('lBtn').disabled = false; }
});
function isLight(){ const t = document.documentElement.dataset.theme; return t ? t === 'light' : matchMedia('(prefers-color-scheme: light)').matches; }
function drawThemeBtn(){ $('themeBtn').textContent = isLight() ? '☾ Dark' : '☀ Light'; }
$('themeBtn').addEventListener('click', () => { const t = isLight() ? 'dark' : 'light'; document.documentElement.dataset.theme = t; store.set('wc_theme', t); drawThemeBtn(); });
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', drawThemeBtn);
drawThemeBtn();
drawUserChip();
$('srcSeg').querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => {
  S.source = b.dataset.src; drawSource(); run($('q').value);
}));
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (S.detail && $('modal').classList.contains('open') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')){
    if (e.key === 'ArrowRight'){ e.preventDefault(); moveDetail(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); moveDetail(-1); }
    else if (e.key === ' '){ e.preventDefault(); toggleDetailSel(); }
  }
  if (e.key === '/' && document.activeElement !== $('q') && !$('modal').classList.contains('open')) { e.preventDefault(); $('q').focus(); }
});
drawEx();
const initial = new URLSearchParams(location.search).get('q');
if (initial) $('q').value = initial;
boot();
</script>
</body>
</html>
